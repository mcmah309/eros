name: Rust CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - ""
          - "--all-features"
          - "--no-default-features"
          - "--no-default-features --features std"
          - "--no-default-features --features context"
          - "--no-default-features --features location"
          - "--no-default-features --features diagnostic"
          - "--no-default-features --features context,location,user_context,diagnostic"
          - "--no-default-features --features anyhow"
          - "--no-default-features --features backtrace,diagnostic"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          # trybuild snapshots include standard-library source excerpts.
          components: rust-src
          override: true

      - name: Run tests
        env:
          RUST_BACKTRACE: "0"
          RUST_LIB_BACKTRACE: "0"
        # Select eros alone: eros-macros' dev dependency enables eros' defaults
        # during workspace tests, masking failures in disabled feature paths.
        run: cargo test -p eros ${{ matrix.args }}

      - name: Test procedural macro crate
        if: matrix.args == ''
        run: cargo test -p eros-macros

      - name: Test captured backtraces
        if: matrix.args == '--all-features'
        env:
          RUST_BACKTRACE: "1"
          RUST_LIB_BACKTRACE: "1"
        run: >-
          cargo test -p eros --all-features
          --test formatting --test reshaping --test union_conversions
          --test single_reshaping --test group_recovery --test try_recover

  miri:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Nightly Rust with Miri
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          components: miri
          override: true

      - name: Run Miri tests
        env:
          RUSTFLAGS: "--cfg test_in_ci"
          # Formatting a captured std backtrace reads the working directory.
          MIRIFLAGS: "-Zmiri-disable-isolation"
          RUST_BACKTRACE: "0"
          RUST_LIB_BACKTRACE: "0"
        run: |
          cargo miri test -p eros
          cargo miri test -p eros --no-default-features

  no-std:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
          override: true

      - name: Check builds without std
        run: cargo build -p eros-no-std-test --no-default-features --target thumbv7em-none-eabihf --release

      - name: Run no_std tests (on host)
        env:
          RUSTFLAGS: "--cfg test_in_ci"
        run: cargo test -p eros-no-std-test
