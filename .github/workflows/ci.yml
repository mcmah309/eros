name: Rust CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - ""
          - "--all-features"
          - "--no-default-features"
          - "--no-default-features --features alloc"
          - "--no-default-features --features alloc,location"
          - "--no-default-features --features std"
          - "--no-default-features --features context"
          - "--no-default-features --features location"
          - "--no-default-features --features diagnostic"
          - "--no-default-features --features context,location,user_context,diagnostic"
          - "--no-default-features --features anyhow"
          - "--no-default-features --features backtrace,diagnostic"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Rust
        # Use rust-toolchain.toml locally and in CI; trybuild snapshots depend on rustc.
        run: |
          rustup toolchain install --no-self-update
          rustc --version

      - name: Run tests
        env:
          RUST_BACKTRACE: "0"
          RUST_LIB_BACKTRACE: "0"
        # Select eros alone: eros-macros' dev dependency enables eros' defaults
        # during workspace tests, masking failures in disabled feature paths.
        run: cargo test -p eros ${{ matrix.args }}

      - name: Test procedural macro crate
        if: matrix.args == ''
        run: cargo test -p eros-macros

      - name: Test captured backtraces
        if: matrix.args == '--all-features'
        env:
          RUST_BACKTRACE: "1"
          RUST_LIB_BACKTRACE: "1"
        run: >-
          cargo test -p eros --all-features
          --test formatting --test reshaping --test union_conversions
          --test single_reshaping --test group_recovery --test try_recover

  miri:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Nightly Rust with Miri
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          components: miri
          override: true

      - name: Run full Miri suites in debug and release
        env:
          RUSTFLAGS: "--cfg test_in_ci"
          # Formatting a captured std backtrace reads the working directory.
          MIRIFLAGS: "-Zmiri-disable-isolation"
          RUST_BACKTRACE: "0"
          RUST_LIB_BACKTRACE: "0"
        run: |
          cargo +nightly miri test -p eros
          cargo +nightly miri test -p eros --no-default-features
          cargo +nightly miri test -p eros --no-default-features --features alloc
          cargo +nightly miri test -p eros --no-default-features --features location --lib --test zst --test type_set --test no_alloc_composition
          cargo +nightly miri test -p eros --release
          cargo +nightly miri test -p eros --release --no-default-features
          cargo +nightly miri test -p eros --release --no-default-features --features alloc

  no-std:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Rust
        run: |
          rustup toolchain install --no-self-update
          rustc --version
          rustup target add thumbv7em-none-eabihf

      - name: Check builds without std
        run: cargo build -p eros-no-std-test --no-default-features --target thumbv7em-none-eabihf --release

      - name: Run no_std tests (on host)
        env:
          RUSTFLAGS: "--cfg test_in_ci"
        run: cargo test -p eros-no-std-test

      - name: Test core-only APIs (on host)
        run: cargo test -p eros-no-alloc-test --lib --features location

      - name: Build embedded executable without an allocator
        run: >-
          cargo rustc -p eros-no-alloc-test --bin no-allocator
          --features freestanding,location --target thumbv7em-none-eabihf --release
          -- -C linker=rust-lld -C link-arg=--entry=_start

      - name: Run executable without an allocator
        run: |
          CARGO_PROFILE_RELEASE_PANIC=abort cargo rustc -p eros-no-alloc-test --bin no-allocator --features freestanding,location --release -- -C relocation-model=static -C link-arg=-static -C link-arg=-nostartfiles
          ./target/release/no-allocator
