[package]
name = "eros"
version = "0.8.1"
edition = "2024"
description = "Ergonomic error handling with typed or untyped errors, context, and no enum boilerplate."
license = "Apache-2.0"
repository = "https://github.com/mcmah309/eros"
categories = ["rust-patterns", "no-std"]
keywords = ["error", "error-handling"]
readme = "README.md"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test_in_ci)'] }

[dependencies]
eros-macros = { version = "0.8.1", path = "../eros-macros" }
# Adds `ErrorUnion::from_anyhow` for converting `anyhow::Error`s into a `ErrorUnion`
anyhow = { version = "1", optional = true }
color-backtrace = { version = "0.7", default-features = false, features = [
    "use-btparse-crate",
], optional = true }
btparse = { version = "0.2", optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }


[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
trybuild = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde_json = "1"
err_trail = { version = "0.11", features = ["tracing"] }
thiserror = "2"

[features]
# Libraries should consider disabling these defaults, allowing downstream crates to decide.
# Or when trying to optimize the binary.
# Keep alloc enabled separately if errors exceed the inline capacity.
default = ["alloc", "context", "backtrace"]
# Enables heap fallback for errors exceeding one word, and owned messages.
alloc = []
# Enables the `std` library. Required for `backtrace` and `anyhow` features. When disabled,
# `eros` is `no_std`. Without alloc, errors must fit the inline size/alignment.
std = ["alloc"]
# Enables context
context = ["alloc", "eros-macros/context"]
# Enables backtrace
backtrace = ["std"]
# Parses and removes the unnecessary noise from the backtrace before printing
better_backtrace = ["backtrace", "dep:color-backtrace", "dep:btparse"]
# Enables location capture
location = []
# Add integration with anyhow
anyhow = ["std", "dep:anyhow"]
# Adds context methods that are user facing. Useful for applications reporting error messages to users.
user_context = ["context"]
# Exposes to_display_json()/to_debug_json() as structured JSON values.
diagnostic = ["alloc", "dep:serde_json"]
